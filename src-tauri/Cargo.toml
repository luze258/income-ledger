[package]
name = "income_ledger"
version = "2.2.4"
description = "收益账本桌面应用"
authors = ["路泽"]
license = "MIT"
repository = "https://github.com/luze258/income-ledger"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "income_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
futures-core = "0.3.31"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
