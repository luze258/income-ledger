name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:versions
      - name: Ensure tag matches the application version
        shell: pwsh
        run: |
          $expectedTag = "v$(node -p \"require('./package.json').version\")"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "发布标签应为 $expectedTag，实际为 $env:GITHUB_REF_NAME。"
          }
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
