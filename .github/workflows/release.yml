name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:versions
      - run: npm run test
      - run: npx tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Ensure tag matches the application version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "发布标签应为 $expectedTag，实际为 $env:GITHUB_REF_NAME。"
          }
      - run: npm run tauri build
      - name: Prepare a portable release asset name
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "预期找到 1 个 NSIS 安装包，实际找到 $($installers.Count) 个。"
          }

          $installer = $installers[0]
          $version = node -p "require('./package.json').version"
          $assetName = "income-ledger_$($version)_x64-setup.exe"
          $assetPath = Join-Path $installer.DirectoryName $assetName

          Copy-Item -LiteralPath $installer.FullName -Destination $assetPath
          if (-not (Test-Path -LiteralPath $assetPath)) {
            throw "未生成预期安装包：$assetName"
          }

          Write-Output "将上传安装包：$assetPath"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/income-ledger_*-setup.exe
