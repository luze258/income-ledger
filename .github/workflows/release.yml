name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:versions
      - name: Ensure tag matches the application version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "发布标签应为 $expectedTag，实际为 $env:GITHUB_REF_NAME。"
          }
      - run: npm run tauri build
      - name: Prepare a portable release asset name
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw '未找到 NSIS 安装包。'
          }
          $version = node -p "require('./package.json').version"
          Copy-Item -LiteralPath $installer.FullName -Destination "src-tauri/target/release/bundle/nsis/income-ledger_$($version)_x64-setup.exe"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/income-ledger_*-setup.exe
